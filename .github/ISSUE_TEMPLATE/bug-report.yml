name: Bug Report
description: Report a defect, scoring error, or UI regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Add a person named 'Mom'.
        2. Answer questionnaire items 1-9 with: 7, 7, 7, 7, 1, 1, 1, 1, 1.
        3. Check calculated scores on chart.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior vs Actual Behavior
      description: What should have happened according to the PRD.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser version, OS, screen size.
